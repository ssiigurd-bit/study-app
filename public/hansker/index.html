<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hansketeller">
<meta name="description" content="Lynrask teller for hanskebruk på vakt.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Hansketeller</title>
<style>
:root{
  --bg:#0b0d12; --panel:#151922; --panel2:#1e2331; --line:#2a3042;
  --text:#f4f6fb; --muted:#97a0b3;
  --green:#3ef08f; --lime:#c4f53a; --pink:#ff4fa8; --orange:#ff9b3d;
  --ink:#0d1210;
  --r:24px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--lime);outline-offset:3px}

#app{height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;
  padding:calc(var(--sat) + 10px) 14px calc(var(--sab) + 12px);
  background:
    radial-gradient(120% 60% at 100% 0%,rgba(255,79,168,.16),transparent 60%),
    radial-gradient(100% 50% at 0% 100%,rgba(62,240,143,.12),transparent 60%),
    var(--bg)}

/* topp */
.top{display:flex;align-items:center;gap:10px}
.status{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:var(--panel);
  font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted)}
.chip .dot{width:10px;height:10px;border-radius:50%;background:#555c6e}
.chip.on{color:var(--text)}
.chip.on .dot{background:var(--green);box-shadow:0 0 0 0 rgba(62,240,143,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(62,240,143,0)}100%{box-shadow:0 0 0 0 rgba(62,240,143,0)}}
.title{margin-top:6px;font-weight:900;font-size:21px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:60px;height:60px;border-radius:20px;background:var(--panel);display:grid;place-items:center;flex:none}
.icon svg{width:28px;height:28px}
.icon:active{transform:scale(.94)}

.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.strip>div{background:var(--panel);border-radius:18px;padding:9px 10px;text-align:center}
.strip b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.strip span{font-size:12px;color:var(--muted);font-weight:700}
#hourCount{color:var(--pink)} #rate{color:var(--orange)} #sinceLast{color:var(--green)}

/* stor knapp */
main{min-height:0;display:flex}
#big{position:relative;overflow:hidden;flex:1;border-radius:36px;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:
    radial-gradient(90% 70% at 85% 10%,rgba(255,255,255,.35),transparent 55%),
    linear-gradient(155deg,var(--green) 0%,var(--lime) 48%,var(--orange) 100%);
  box-shadow:0 18px 50px -18px rgba(62,240,143,.55), inset 0 -10px 0 rgba(0,0,0,.12);
  transition:transform .08s ease}
#big:active{transform:scale(.985)}
#big .num{font-size:clamp(110px,40vw,240px);font-weight:900;line-height:.9;letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;display:block}
#big[data-len="3"] .num{font-size:clamp(96px,31vw,200px)}
#big[data-len="4"] .num,#big[data-len="5"] .num{font-size:clamp(80px,24vw,170px)}
#big .unit{font-size:24px;font-weight:900;margin-top:6px;opacity:.85}
#big .hint{position:absolute;bottom:18px;font-size:15px;font-weight:800;opacity:.6}
.pop{animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.82)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none;
  width:40px;height:40px;margin:-20px 0 0 -20px;animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:scale(14);opacity:0}}
.plus{position:absolute;pointer-events:none;font-weight:900;font-size:34px;color:var(--ink);
  animation:float .7s ease-out forwards}
@keyframes float{to{transform:translateY(-90px) scale(1.3);opacity:0}}

/* bunn */
.bottom{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
.bottom button{position:relative;overflow:hidden;height:76px;border-radius:24px;font-weight:900;font-size:20px}
.bottom .lbl{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.bottom small{font-size:12px;font-weight:800;opacity:.7;margin-top:3px}
.fill{position:absolute;inset:0;transform:scaleX(0);transform-origin:left}
.undo{background:var(--panel2);color:var(--pink);border:2px solid rgba(255,79,168,.45)}
.undo .fill{background:rgba(255,79,168,.35)}
.shift{background:var(--orange);color:var(--ink)}
.shift .fill{background:rgba(0,0,0,.25)}
.shift.end{background:var(--panel2);color:var(--orange);border:2px solid rgba(255,155,61,.5)}
.shift.end .fill{background:rgba(255,155,61,.35)}

/* overlays */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
#celebrate{position:fixed;left:16px;right:16px;top:30%;z-index:51;pointer-events:none;text-align:center;
  opacity:0;transform:scale(.6)}
#celebrate.show{animation:cele 2.6s ease forwards}
#celebrate .card{display:inline-block;background:var(--bg);border:3px solid var(--pink);border-radius:28px;padding:18px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}
#celebrate h2{margin:0;font-size:34px;font-weight:900;letter-spacing:-.02em;
  background:linear-gradient(90deg,var(--green),var(--lime),var(--orange),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
#celebrate p{margin:6px 0 0;font-size:17px;font-weight:700}
@keyframes cele{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.06)}20%{transform:scale(1)}82%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 104px);transform:translate(-50%,20px);z-index:60;
  background:var(--text);color:var(--bg);font-weight:800;padding:12px 18px;border-radius:99px;opacity:0;
  transition:.2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;font-size:15px}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ark */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
#sheetSummary{z-index:45}
.sheet header{display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 10px) 14px 10px;border-bottom:1px solid var(--line)}
.sheet header h1{flex:1;margin:0;font-size:26px;font-weight:900;letter-spacing:-.02em}
.sheet .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px calc(var(--sab) + 30px)}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px;font-weight:900}
h3:first-child{margin-top:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border-radius:20px;padding:14px}
.tile b{display:block;font-size:26px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted);font-weight:700}
.tile small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.tile.g b{color:var(--green)} .tile.p b{color:var(--pink)} .tile.o b{color:var(--orange)} .tile.l b{color:var(--lime)}
.card2{background:var(--panel);border-radius:20px;padding:14px}
.muted{color:var(--muted)}

.bars{display:flex;align-items:stretch;gap:6px;height:180px;overflow-x:auto;padding-bottom:2px}
.bar{flex:1 0 28px;display:flex;flex-direction:column;align-items:center;min-width:28px}
.bv{font-size:11px;font-weight:800;color:var(--muted);height:16px}
.bt{flex:1;width:100%;position:relative}
.bf{position:absolute;left:3px;right:3px;bottom:0;border-radius:8px 8px 3px 3px;background:var(--green);min-height:3px}
.bar.hl .bf{background:linear-gradient(var(--pink),var(--orange))}
.bar.hl .bv{color:var(--pink)}
.bl{font-size:11px;font-weight:700;color:var(--muted);margin-top:5px;white-space:nowrap}
.bars.orange .bf{background:var(--orange)} .bars.pink .bf{background:var(--pink)}
.gaps{display:flex;align-items:flex-end;gap:2px;height:70px}
.gaps i{flex:1;background:var(--pink);border-radius:3px 3px 0 0;min-height:2px}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border-radius:18px;padding:12px 14px;min-height:64px}
.row .n{font-size:26px;font-weight:900;min-width:54px;text-align:center;color:var(--green);font-variant-numeric:tabular-nums}
.row .meta{flex:1;min-width:0}
.row .meta b{display:block;font-size:16px}
.row .meta span{font-size:13px;color:var(--muted)}
.row .tag{font-size:12px;font-weight:900;color:var(--pink)}

.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:60px;border-radius:18px;font-weight:900;font-size:17px;background:var(--panel2);margin-top:10px}
.btn.primary{background:var(--green);color:var(--ink)}
.btn.danger{color:var(--pink);border:2px solid rgba(255,79,168,.4)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--panel);padding:6px;border-radius:20px}
.seg button{min-height:60px;border-radius:15px;font-weight:900;font-size:16px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--ink)}
.field{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:18px;padding:0 16px;min-height:64px}
.field input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;font-size:24px;font-weight:900;height:60px}
.field span{font-weight:800;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:64px;background:var(--panel);border-radius:18px;padding:0 16px;font-weight:800;font-size:17px}
.toggle i{width:58px;height:34px;border-radius:99px;background:#3a4155;position:relative;transition:.2s}
.toggle i::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.toggle[aria-pressed="true"] i{background:var(--green)}
.toggle[aria-pressed="true"] i::after{left:28px}
.hero{text-align:center;padding:10px 0 4px}
.hero .bign{font-size:110px;font-weight:900;line-height:.9;letter-spacing:-.05em;
  background:linear-gradient(150deg,var(--green),var(--lime) 50%,var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .u{font-size:20px;font-weight:900}
.hero .badge{display:inline-block;margin-top:12px;padding:8px 14px;border-radius:99px;background:var(--panel2);font-weight:900}
.hero .badge.rec{background:var(--pink);color:var(--ink)}
.empty{text-align:center;padding:50px 10px;color:var(--muted);font-weight:700}
.empty div{font-size:64px}
p.note{font-size:14px;color:var(--muted);line-height:1.5}
@media (prefers-reduced-motion:reduce){.pop,.ripple,.plus,#celebrate.show{animation-duration:.01s}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="status">
      <div class="chip" id="chip"><span class="dot"></span><span id="timer">Ingen vakt</span></div>
      <div class="title" id="pace">Klar for vakt?</div>
    </div>
    <button class="icon" id="btnStats" aria-label="Statistikk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
    </button>
    <button class="icon" id="btnSettings" aria-label="Innstillinger">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.4"/><circle cx="10" cy="17" r="2.4"/></svg>
    </button>
  </header>

  <div class="strip">
    <div><b id="hourCount">0</b><span id="hourLabel">denne timen</span></div>
    <div><b id="rate">–</b><span>snitt per time</span></div>
    <div><b id="sinceLast">–</b><span>siden sist</span></div>
  </div>

  <main>
    <button id="big" aria-label="Legg til hansker">
      <span class="num" id="count" aria-live="polite">0</span>
      <span class="unit" id="unit">par hansker</span>
      <span class="hint" id="hint">Trykk for å starte vakt</span>
    </button>
  </main>

  <footer class="bottom">
    <button class="undo" id="btnUndo" aria-label="Angre siste (hold inne)">
      <span class="fill"></span><span class="lbl">−1<small>hold for å angre</small></span>
    </button>
    <button class="shift" id="btnShift">
      <span class="fill"></span><span class="lbl" id="shiftLbl">Start vakt</span>
    </button>
  </footer>
</div>

<canvas id="confetti"></canvas>
<div id="celebrate"></div>
<div id="toast" role="status"></div>

<section class="sheet" id="sheetStats" aria-label="Statistikk">
  <header><h1>Statistikk</h1><button class="icon" data-close aria-label="Lukk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="body" id="statsBody"></div>
</section>
<section class="sheet" id="sheetSettings" aria-label="Innstillinger">
  <header><h1>Innstillinger</h1><button class="icon" data-close aria-label="Lukk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="body" id="settingsBody"></div>
</section>
<section class="sheet" id="sheetSummary" aria-label="Vaktoppsummering">
  <header><h1 id="sumTitle">Vakt ferdig!</h1><button class="icon" data-close aria-label="Lukk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="body" id="summaryBody"></div>
</section>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const KEY = 'hansketeller.v1';
const HOUR = 3600e3, MIN = 60e3;
const STALE = 10 * HOUR;            // åpen vakt uten aktivitet så lenge avsluttes automatisk
const MILESTONES = [10, 25, 50, 75, 100, 150, 200, 300, 500];
const COLORS = ['#3ef08f', '#c4f53a', '#ff9b3d', '#ff4fa8', '#ffffff'];

/* ---------- lagring ---------- */
const DEFAULT = { settings: { mode: 'pair', price: 0, haptics: true }, current: null, shifts: [] };
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      return { ...DEFAULT, ...d, settings: { ...DEFAULT.settings, ...(d.settings || {}) }, shifts: Array.isArray(d.shifts) ? d.shifts : [] };
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT));
}
let S = load();
let saveWarned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { if (!saveWarned) { saveWarned = true; toast('Klarte ikke å lagre – er privat modus på?'); } }
}

/* ---------- hjelpere ---------- */
// Hver hendelse er [tidspunkt, antall enkelthansker] – så bytte av modus midt i en vakt går fint.
const glovesOf = sh => sh ? sh.ev.reduce((a, e) => a + e[1], 0) : 0;
const pair = () => S.settings.mode === 'pair';
const units = g => pair() ? g / 2 : g;
const unitLabel = u => pair() ? 'par hansker' : (u === 1 ? 'hanske' : 'hansker');
const unitShort = () => pair() ? 'par' : 'stk';
const fmtN = (n, d = 1) => {
  if (!isFinite(n)) return '–';
  const r = Math.round(n * 10 ** d) / 10 ** d;
  return Number.isInteger(r) ? String(r) : r.toFixed(d).replace('.', ',');
};
const kr = n => n.toLocaleString('nb-NO', { maximumFractionDigits: n < 100 ? 2 : 0 }) + ' kr';
const pad = n => String(n).padStart(2, '0');
function clock(ms) { const s = Math.floor(ms / 1000); return `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`; }
function dur(ms) {
  const m = Math.round(ms / MIN);
  if (m < 1) return `${Math.round(ms / 1000)} s`;
  if (m < 60) return `${m} min`;
  return `${Math.floor(m / 60)} t ${m % 60} min`;
}
function gap(ms) {
  const s = Math.round(ms / 1000);
  if (s < 60) return `${s} s`;
  if (s < 3600) return `${Math.floor(s / 60)} min ${s % 60 ? (s % 60) + ' s' : ''}`.trim();
  return dur(ms);
}
function since(ms) {
  const s = Math.floor(ms / 1000);
  if (s < 3600) return `${Math.floor(s / 60)}:${pad(s % 60)}`;
  return `${Math.floor(s / 3600)}t ${pad(Math.floor(s / 60) % 60)}m`;
}
const DAYS = ['søn', 'man', 'tir', 'ons', 'tor', 'fre', 'lør'];
const dateStr = t => { const d = new Date(t); return `${DAYS[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}.`; };
const timeStr = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

function paceTitle(pph, any) {
  // pph = par per time
  if (!any) return 'Oppvarming 🍋';
  if (pph < 2) return 'Zen-modus 🧘';
  if (pph < 4) return 'Rolig smoothie 🥤';
  if (pph < 7) return 'Juicepresse 🍊';
  if (pph < 11) return 'Hanskemaskin ⚙️';
  if (pph < 16) return 'Lateks-tornado 🌪️';
  return 'Hanskeguden ⚡';
}

function shiftStats(sh) {
  const g = glovesOf(sh);
  const end = sh.end || Date.now();
  const d = Math.max(end - sh.start, 1);
  const ts = sh.ev.map(e => e[0]);
  const gaps = [];
  for (let i = 1; i < ts.length; i++) gaps.push(ts[i] - ts[i - 1]);
  const avg = gaps.length ? gaps.reduce((a, b) => a + b, 0) / gaps.length : NaN;
  return {
    g, d, pairs: g / 2,
    perHour: units(g) / (d / HOUR),
    pph: (g / 2) / (d / HOUR),
    gaps, avgGap: avg,
    minGap: gaps.length ? Math.min(...gaps) : NaN,
    maxGap: gaps.length ? Math.max(...gaps) : NaN,
    cost: (g / 2) * (S.settings.price || 0),
  };
}
const bestPrev = () => S.shifts.reduce((m, s) => Math.max(m, glovesOf(s)), 0);

/* ---------- tilbakemelding ---------- */
// iOS støtter ikke navigator.vibrate, men en skjult <input switch> gir haptikk i Safari 18+.
const hapticLabel = document.createElement('label');
hapticLabel.innerHTML = '<input type="checkbox" switch tabindex="-1" aria-hidden="true">';
hapticLabel.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;pointer-events:none';
document.body.append(hapticLabel);
function haptic(pattern) {
  if (!S.settings.haptics) return;
  try {
    if (navigator.vibrate) navigator.vibrate(pattern);
    else hapticLabel.click();
  } catch (e) {}
}

let toastT = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

/* konfetti */
const cv = $('#confetti'), cx = cv.getContext('2d');
let parts = [], raf = 0;
function sizeCanvas() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function confetti(n = 150) {
  sizeCanvas();
  const W = innerWidth, H = innerHeight;
  for (let i = 0; i < n; i++) {
    const fromSide = i % 3 === 0;
    parts.push({
      x: fromSide ? (i % 2 ? -10 : W + 10) : W / 2 + (Math.random() - .5) * W * .4,
      y: fromSide ? H * .7 : H * .5,
      vx: fromSide ? (i % 2 ? 1 : -1) * (6 + Math.random() * 9) : (Math.random() - .5) * 16,
      vy: -(8 + Math.random() * 14),
      r: Math.random() * 6, vr: (Math.random() - .5) * .35,
      w: 7 + Math.random() * 8, h: 4 + Math.random() * 6,
      c: COLORS[i % COLORS.length], life: 0, round: Math.random() < .25,
    });
  }
  if (!raf) raf = requestAnimationFrame(step);
}
function step() {
  const H = innerHeight;
  cx.clearRect(0, 0, innerWidth, H);
  parts = parts.filter(p => p.y < H + 30 && p.life < 360);
  for (const p of parts) {
    p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    if (p.round) { cx.beginPath(); cx.arc(0, 0, p.h / 1.4, 0, 7); cx.fill(); }
    else cx.fillRect(-p.w / 2, -p.h / 2 * Math.abs(Math.cos(p.r * 2)), p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 1);
    cx.restore();
  }
  raf = parts.length ? requestAnimationFrame(step) : (cx.clearRect(0, 0, innerWidth, H), 0);
}

const MSG = {
  10: ['Tosifret! Nå er du i gang 🍓', 'Ti på tavla – hendene er varme 🔥'],
  25: ['Kvart hundre, null nøl 🥝', 'Du er offisielt en juicemaskin 🍊'],
  50: ['FEMTI! Noen burde lage en statue av deg 🗿', 'Lateks-legende låst opp 🏆'],
};
const GENERIC = ['Hanskene ser deg. Hanskene respekterer deg 🫡', 'Hygiene-helt i aksjon 🦸', 'Det står respekt av dette 💪', 'Sitruskraft! 🍋'];
const pick = a => a[Math.floor(Math.random() * a.length)];
function celebrate(title, text) {
  const c = $('#celebrate');
  c.innerHTML = `<div class="card"><h2>${title}</h2><p>${text}</p></div>`;
  c.classList.remove('show'); void c.offsetWidth; c.classList.add('show');
  confetti();
  haptic([30, 60, 30, 60, 60]);
}

/* ---------- skjermlås ---------- */
let wl = null;
async function wake() {
  try {
    if (S.current && 'wakeLock' in navigator && document.visibilityState === 'visible' && !wl) {
      wl = await navigator.wakeLock.request('screen');
      wl.addEventListener('release', () => { wl = null; });
    }
  } catch (e) {}
}
function unwake() { try { wl && wl.release(); } catch (e) {} wl = null; }

/* ---------- vakter ---------- */
function startShift(auto) {
  const now = Date.now();
  S.current = { id: now.toString(36), start: now, ev: [], ms: [], rec: false };
  save(); wake();
  toast(auto ? 'Vakt startet automatisk ⏱️' : 'Vakt i gang – lykke til! 🍹');
}
function endShift(at, note) {
  const cur = S.current;
  if (!cur) return;
  S.current = null; unwake();
  if (!cur.ev.length) { save(); render(); toast('Tom vakt – ikke lagret'); return; }
  const prev = bestPrev();
  const sh = { id: cur.id, start: cur.start, end: at || Date.now(), ev: cur.ev };
  S.shifts.push(sh);
  save(); render();
  showSummary(sh, { record: glovesOf(sh) > prev && prev > 0, note });
}

let lastTap = 0;
function tap(x, y) {
  const now = Date.now();
  if (now - lastTap < 110) return;        // demper dobbeltregistrering fra våte fingre
  lastTap = now;
  if (!S.current) startShift(true);
  const cur = S.current;
  const before = units(glovesOf(cur));
  cur.ev.push([now, pair() ? 2 : 1]);
  const total = glovesOf(cur), after = units(total);
  save();

  haptic(14);
  feedback(x, y);
  render();

  const prev = bestPrev();
  if (prev > 0 && total > prev && !cur.rec) {
    cur.rec = true; save();
    celebrate('NY VAKTREKORD! 🏆', `Du slo forrige rekord på ${fmtN(units(prev))} ${unitShort()}. Legendarisk.`);
    return;
  }
  const m = MILESTONES.find(m => before < m && after >= m && !cur.ms.includes(m));
  if (m) {
    cur.ms.push(m); save();
    celebrate(`${m} ${unitLabel(m)}!`, pick(MSG[m] || GENERIC));
  }
}
function undo() {
  const cur = S.current;
  if (!cur || !cur.ev.length) { toast('Ingenting å angre'); return; }
  cur.ev.pop(); save();
  haptic([12, 50, 12]);
  render();
  toast(`Angret – nå ${fmtN(units(glovesOf(cur)))} ${unitShort()}`);
}

/* ---------- visuell respons ---------- */
const big = $('#big');
function feedback(x, y) {
  const r = big.getBoundingClientRect();
  const lx = (x ?? r.left + r.width / 2) - r.left, ly = (y ?? r.top + r.height / 2) - r.top;
  const rp = document.createElement('span');
  rp.className = 'ripple'; rp.style.left = lx + 'px'; rp.style.top = ly + 'px';
  big.append(rp); setTimeout(() => rp.remove(), 600);
  const pl = document.createElement('span');
  pl.className = 'plus'; pl.textContent = '+1';
  pl.style.left = (lx - 20) + 'px'; pl.style.top = (ly - 50) + 'px';
  big.append(pl); setTimeout(() => pl.remove(), 750);
  const n = $('#count');
  n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop');
}

/* ---------- hovedvisning ---------- */
function render() {
  const cur = S.current;
  const u = units(glovesOf(cur));
  const txt = fmtN(u);
  $('#count').textContent = txt;
  big.dataset.len = txt.length;
  $('#unit').textContent = unitLabel(u);
  $('#hint').textContent = cur ? (pair() ? 'Trykk = +1 par' : 'Trykk = +1 hanske') : 'Trykk for å starte vakt';
  const sb = $('#btnShift');
  sb.classList.toggle('end', !!cur);
  $('#shiftLbl').innerHTML = cur ? 'Avslutt vakt<small>hold inne</small>' : 'Start vakt';
  $('#chip').classList.toggle('on', !!cur);
  tick();
}
function tick() {
  const cur = S.current, now = Date.now();
  if (!cur) {
    $('#timer').textContent = 'Ingen vakt';
    $('#pace').textContent = S.shifts.length ? 'Klar for en ny runde?' : 'Klar for vakt?';
    $('#hourCount').textContent = '0';
    $('#rate').textContent = '–';
    $('#sinceLast').textContent = '–';
    return;
  }
  if (now - (cur.ev.length ? cur.ev[cur.ev.length - 1][0] : cur.start) > STALE) { endShift(cur.ev.length ? cur.ev[cur.ev.length - 1][0] : cur.start, 'Vakten ble avsluttet automatisk fordi det var lenge siden siste trykk.'); return; }
  const el = now - cur.start;
  $('#timer').textContent = clock(el);
  const hs = new Date(now); hs.setMinutes(0, 0, 0);
  const h = hs.getHours();
  $('#hourCount').textContent = fmtN(units(cur.ev.filter(e => e[0] >= hs.getTime()).reduce((a, e) => a + e[1], 0)));
  $('#hourLabel').textContent = `denne timen (${pad(h)}–${pad((h + 1) % 24)})`;
  $('#rate').textContent = el >= 5 * MIN ? fmtN(units(glovesOf(cur)) / (el / HOUR)) : '–';
  $('#sinceLast').textContent = cur.ev.length ? since(now - cur.ev[cur.ev.length - 1][0]) : '–';
  // tempo-tittel: siste 60 min, min. 15 min vindu så den ikke flipper helt i starten
  const win = Math.min(60, Math.max(el / MIN, 15));
  const recent = cur.ev.filter(e => e[0] >= now - win * MIN).reduce((a, e) => a + e[1], 0);
  $('#pace').textContent = paceTitle((recent / 2) / (win / 60), cur.ev.length > 0);
}

/* ---------- trykk-oppsett ---------- */
big.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  e.preventDefault();
  tap(e.clientX, e.clientY);
});
big.addEventListener('click', e => { if (e.detail === 0) tap(); }); // tastatur
big.addEventListener('contextmenu', e => e.preventDefault());

function holdable(el, getMs, done, hint) {
  const fill = el.querySelector('.fill');
  let t = 0, t0 = 0;
  const reset = () => { fill.style.transition = 'transform .18s'; fill.style.transform = 'scaleX(0)'; };
  const cancel = showHint => {
    if (!t) return;
    clearTimeout(t); t = 0; reset();
    if (showHint && hint && Date.now() - t0 < 350) toast(hint());
  };
  el.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    e.preventDefault();
    try { el.releasePointerCapture(e.pointerId); } catch (_) {}
    const ms = getMs();
    if (!ms) { done(); return; }
    t0 = Date.now();
    fill.style.transition = 'none'; fill.style.transform = 'scaleX(0)'; void fill.offsetWidth;
    fill.style.transition = `transform ${ms}ms linear`; fill.style.transform = 'scaleX(1)';
    clearTimeout(t);
    t = setTimeout(() => { t = 0; reset(); done(); }, ms);
  });
  el.addEventListener('pointerup', () => cancel(true));
  el.addEventListener('pointerleave', () => cancel(false));
  el.addEventListener('pointercancel', () => cancel(false));
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('click', e => { if (e.detail === 0) done(); });
}
holdable($('#btnUndo'), () => 450, undo, () => 'Hold inne for å angre');
holdable($('#btnShift'), () => S.current ? 900 : 0,
  () => { if (S.current) endShift(); else { startShift(false); haptic(20); render(); } },
  () => 'Hold inne for å avslutte vakten');

/* ---------- ark (med tilbake-knapp-støtte) ---------- */
const stack = [];
function openSheet(id) {
  $(id).classList.add('open'); stack.push(id);
  try { history.pushState({ sheet: stack.length }, ''); } catch (e) {}
}
function closeTop() {
  if (!stack.length) return;
  if (history.state && history.state.sheet) history.back();
  else $(stack.pop()).classList.remove('open');
}
addEventListener('popstate', () => { const id = stack.pop(); if (id) $(id).classList.remove('open'); });
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeTop));
$('#btnStats').addEventListener('click', () => { renderStats(); openSheet('#sheetStats'); });
$('#btnSettings').addEventListener('click', () => { renderSettings(); openSheet('#sheetSettings'); });

/* ---------- diagrammer ---------- */
function bars(items, cls = '') {
  const max = Math.max(1e-9, ...items.map(i => i.v));
  return `<div class="bars ${cls}">${items.map(i => `
    <div class="bar${i.hl ? ' hl' : ''}" title="${i.t || ''}">
      <span class="bv">${i.v ? fmtN(i.v) : ''}</span>
      <div class="bt"><div class="bf" style="height:${i.v / max * 100}%"></div></div>
      <span class="bl">${i.l}</span>
    </div>`).join('')}</div>`;
}
const tile = (v, l, c = '', sub = '') => `<div class="tile ${c}"><b>${v}</b><span>${l}</span>${sub ? `<small>${sub}</small>` : ''}</div>`;

/* ---------- oppsummering ---------- */
function showSummary(sh, opt = {}) {
  const st = shiftStats(sh);
  const u = units(st.g);
  const best = S.shifts.reduce((m, s) => Math.max(m, glovesOf(s)), 0);
  const isRec = opt.record || (opt.fromHistory && st.g === best && S.shifts.length > 1);
  $('#sumTitle').textContent = opt.fromHistory ? dateStr(sh.start) : 'Vakt ferdig! 🎉';
  const maxGap = Math.max(1, ...st.gaps);
  $('#summaryBody').innerHTML = `
    <div class="hero">
      <div class="bign">${fmtN(u)}</div>
      <div class="u">${unitLabel(u)}</div>
      <div class="badge${isRec ? ' rec' : ''}">${isRec ? '🏆 Rekordvakt!' : st.d < 5 * MIN ? 'Lynvakt ⚡' : paceTitle(st.pph, st.g > 0)}</div>
    </div>
    ${opt.note ? `<p class="note">${opt.note}</p>` : ''}
    <h3>Vakten</h3>
    <div class="tiles">
      ${tile(dur(st.d), 'varighet', 'l', `${timeStr(sh.start)}–${timeStr(sh.end)}`)}
      ${tile(st.d >= 5 * MIN ? fmtN(st.perHour) : '–', `${unitShort()} per time`, 'o')}
      ${tile(isNaN(st.avgGap) ? '–' : gap(st.avgGap), 'snitt mellom bytter', 'g')}
      ${tile(isNaN(st.minGap) ? '–' : gap(st.minGap), 'raskeste bytte', 'p')}
      ${tile(isNaN(st.maxGap) ? '–' : gap(st.maxGap), 'lengste pause', '')}
      ${S.settings.price > 0 ? tile(kr(st.cost), 'kostnad', 'o') : tile(st.g, 'enkelthansker totalt', '')}
    </div>
    ${st.gaps.length > 1 ? `<h3>Tid mellom hvert bytte</h3>
      <div class="card2"><div class="gaps">${st.gaps.map(g => `<i style="height:${g / maxGap * 100}%" title="${gap(g)}"></i>`).join('')}</div>
      <p class="note" style="margin:8px 0 0">Hver søyle er ett bytte. Høy søyle = lang pause.</p></div>` : ''}
    <button class="btn primary" id="sumClose">${opt.fromHistory ? 'Tilbake' : 'Nydelig, lukk'}</button>
    ${opt.fromHistory ? `<button class="btn danger" id="sumDel">Slett denne vakten</button>` : ''}
  `;
  $('#sumClose').onclick = closeTop;
  if (opt.fromHistory) $('#sumDel').onclick = () => {
    if (!confirm('Slette denne vakten for godt?')) return;
    S.shifts = S.shifts.filter(s => s.id !== sh.id); save();
    closeTop(); renderStats(); toast('Vakt slettet');
  };
  openSheet('#sheetSummary');
  if (opt.record) setTimeout(() => celebrate('NY VAKTREKORD! 🏆', 'Dette var din travleste vakt noensinne.'), 350);
}

/* ---------- statistikk ---------- */
function weekStart(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; }
function isoWeek(t) {
  const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const w1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7);
}
function renderStats() {
  const body = $('#statsBody');
  const sh = S.shifts.slice().sort((a, b) => a.start - b.start);
  if (!sh.length) {
    body.innerHTML = `<div class="empty"><div>🧤</div><p>Ingen fullførte vakter ennå.<br>Avslutt en vakt, så dukker statistikken opp her.</p></div>`;
    return;
  }
  const price = S.settings.price || 0;
  const gl = sh.map(glovesOf);
  const totalG = gl.reduce((a, b) => a + b, 0);
  const totalH = sh.reduce((a, s) => a + (s.end - s.start), 0) / HOUR;
  const bestI = gl.indexOf(Math.max(...gl));
  const best = sh[bestI];

  // travleste time på døgnet
  const hours = new Array(24).fill(0);
  sh.forEach(s => s.ev.forEach(e => { hours[new Date(e[0]).getHours()] += e[1]; }));
  const topH = hours.indexOf(Math.max(...hours));
  const used = hours.map((v, i) => v ? i : -1).filter(i => i >= 0);
  const hourItems = [];
  for (let i = Math.min(...used); i <= Math.max(...used); i++) hourItems.push({ v: units(hours[i]), l: pad(i), hl: i === topH });

  // per vakt (siste 14)
  const recent = sh.slice(-14).map(s => ({ v: units(glovesOf(s)), l: `${new Date(s.start).getDate()}.${new Date(s.start).getMonth() + 1}`, hl: s === best }));

  // per uke (siste 10)
  const ws = weekStart(Date.now());
  const weeks = [];
  for (let i = 9; i >= 0; i--) {
    const a = new Date(ws); a.setDate(a.getDate() - 7 * i);
    const b = new Date(a); b.setDate(b.getDate() + 7);
    const g = sh.filter(s => s.start >= a && s.start < b).reduce((x, s) => x + glovesOf(s), 0);
    weeks.push({ v: units(g), l: 'u' + isoWeek(a.getTime()), hl: i === 0 });
  }

  // kostnader per måned
  const now = new Date();
  const mKey = d => d.getFullYear() * 12 + d.getMonth();
  const thisM = mKey(now);
  const mG = k => sh.filter(s => mKey(new Date(s.start)) === k).reduce((x, s) => x + glovesOf(s), 0);
  const MONTHS = ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'des'];

  body.innerHTML = `
    <h3>Oversikt</h3>
    <div class="tiles">
      ${tile(fmtN(units(totalG / sh.length)), `snitt ${unitShort()} per vakt`, 'g')}
      ${tile(fmtN(units(gl[bestI])), `rekordvakt (${unitShort()})`, 'p', dateStr(best.start))}
      ${tile(`${pad(topH)}–${pad((topH + 1) % 24)}`, 'travleste tidspunkt', 'o')}
      ${tile(fmtN(units(totalG) / Math.max(totalH, 1 / 60)), `snitt ${unitShort()} per time`, 'l')}
      ${tile(sh.length, 'vakter totalt')}
      ${tile(fmtN(units(totalG), 0), `${unitShort()} totalt`)}
    </div>

    <h3>Kostnad</h3>
    ${price > 0 ? `<div class="tiles">
      ${tile(kr(totalG / 2 * price / sh.length), 'snitt per vakt', 'o')}
      ${tile(kr(mG(thisM) / 2 * price), `${MONTHS[now.getMonth()]} så langt`, 'p')}
      ${tile(kr(mG(thisM - 1) / 2 * price), `forrige måned`, '')}
      ${tile(kr(totalG / 2 * price), 'totalt', '')}
    </div>` : `<div class="card2 muted">Legg inn pris per par i innstillinger for å se hva hanskene koster.</div>`}

    <h3>Per vakt</h3>
    <div class="card2">${bars(recent)}</div>
    <h3>Per uke</h3>
    <div class="card2">${bars(weeks, 'orange')}</div>
    <h3>Når på døgnet</h3>
    <div class="card2">${bars(hourItems, 'pink')}</div>

    <h3>Historikk</h3>
    <div class="list">${sh.slice().reverse().map(s => {
      const st = shiftStats(s);
      return `<button class="row" data-id="${s.id}">
        <span class="n">${fmtN(units(st.g))}</span>
        <span class="meta"><b>${dateStr(s.start)} · ${timeStr(s.start)}–${timeStr(s.end)}</b>
        <span>${dur(st.d)} · ${fmtN(st.perHour)} ${unitShort()}/t${price > 0 ? ' · ' + kr(st.cost) : ''}</span></span>
        ${s === best && sh.length > 1 ? '<span class="tag">🏆</span>' : ''}
      </button>`;
    }).join('')}</div>

    <h3>Eksport</h3>
    <button class="btn" id="csvShifts">Last ned vakter (CSV)</button>
    <button class="btn" id="csvEvents">Last ned alle trykk (CSV)</button>
  `;
  body.querySelectorAll('.row').forEach(r => r.addEventListener('click', () => {
    const s = S.shifts.find(x => x.id === r.dataset.id);
    if (s) showSummary(s, { fromHistory: true });
  }));
  $('#csvShifts').onclick = exportShifts;
  $('#csvEvents').onclick = exportEvents;
}

/* ---------- CSV ---------- */
const iso = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const num = n => isFinite(n) ? String(Math.round(n * 100) / 100).replace('.', ',') : '';
async function download(name, rows) {
  // Semikolon og desimalkomma, så filen åpnes riktig i norsk Excel/Numbers.
  const text = '﻿' + rows.map(r => r.join(';')).join('\r\n');
  const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
  try {
    const file = new File([blob], name, { type: 'text/csv' });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && matchMedia('(pointer:coarse)').matches) {
      await navigator.share({ files: [file], title: name });
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('CSV lastet ned');
}
function exportShifts() {
  const rows = [['vakt_id', 'start', 'slutt', 'varighet_min', 'hansker_enkelt', 'par', 'par_per_time', 'snitt_mellom_bytter_sek', 'kostnad_kr']];
  S.shifts.slice().sort((a, b) => a.start - b.start).forEach(s => {
    const st = shiftStats(s);
    rows.push([s.id, iso(s.start), iso(s.end), num(st.d / MIN), st.g, num(st.pairs), num(st.pph), num(st.avgGap / 1000), num(st.cost)]);
  });
  download(`hansker-vakter-${iso(Date.now()).slice(0, 10)}.csv`, rows);
}
function exportEvents() {
  const rows = [['vakt_id', 'tidspunkt', 'hansker_enkelt']];
  S.shifts.slice().sort((a, b) => a.start - b.start).forEach(s => s.ev.forEach(e => rows.push([s.id, iso(e[0]), e[1]])));
  download(`hansker-trykk-${iso(Date.now()).slice(0, 10)}.csv`, rows);
}

/* ---------- innstillinger ---------- */
function renderSettings() {
  const st = S.settings;
  $('#settingsBody').innerHTML = `
    <h3>Hva teller ett trykk?</h3>
    <div class="seg" role="group">
      <button data-mode="pair" aria-pressed="${st.mode === 'pair'}">Ett par</button>
      <button data-mode="single" aria-pressed="${st.mode === 'single'}">Én hanske</button>
    </div>
    <h3>Pris per par hansker</h3>
    <label class="field"><input id="price" type="text" inputmode="decimal" placeholder="0" value="${st.price ? String(st.price).replace('.', ',') : ''}"><span>kr / par</span></label>
    <p class="note">Valgfritt. Brukes til å regne ut kostnad per vakt og måned.</p>
    <h3>Følelse</h3>
    <button class="toggle" id="hapt" aria-pressed="${st.haptics}"><span>Vibrasjon ved trykk</span><i></i></button>
    <h3>Data</h3>
    <p class="note">Alt lagres bare på denne telefonen – ingen konto, ingen sky. Legg appen til på hjemskjermen (Del → «Legg til på Hjem-skjerm») for å bruke den som en app, også uten nett.</p>
    <button class="btn danger" id="wipe">Slett all data</button>
  `;
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    S.settings.mode = b.dataset.mode; save(); renderSettings(); render(); haptic(10);
  });
  const p = $('#price');
  p.oninput = () => {
    const v = parseFloat(p.value.replace(',', '.').replace(/[^\d.]/g, ''));
    S.settings.price = isFinite(v) && v > 0 ? v : 0; save();
  };
  $('#hapt').onclick = () => { S.settings.haptics = !S.settings.haptics; save(); renderSettings(); haptic(20); };
  $('#wipe').onclick = () => {
    if (!confirm('Slette ALLE vakter og innstillinger?')) return;
    if (!confirm('Helt sikker? Dette kan ikke angres.')) return;
    S = JSON.parse(JSON.stringify(DEFAULT)); save(); unwake(); render(); closeTop(); toast('Alt er slettet');
  };
}

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wake(); tick(); } });
addEventListener('resize', () => { if (raf) sizeCanvas(); });
addEventListener('storage', e => { if (e.key === KEY) { S = load(); render(); } });
render();
wake();
setInterval(tick, 1000);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
